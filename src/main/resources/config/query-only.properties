# Standalone production overlay for the full-dubbo-consumer build and native-db-query-provider.
# UNRELEASED after published 0.8.0; requires a jar rebuilt from this checkout.
# An existing downloaded 0.8.0 consumer jar does not support the readiness/catalog settings.
# -Dreactor.config.file=src/main/resources/config/query-only.properties
# Keep full surface so the existing CustomerHandler and CustomerQueryClient are registered.
# Command routes/client remain for API compatibility; this is NOT a read-only access-control policy.
sample.consumer.surface=full
sample.consumer.readiness.contracts=query-only
sample.consumer.catalog.enabled=false
sample.dubbo.discovery=static
reactor.dubbo.providers=rest-sample-dubbo-provider:20880
reactor.runtime.profile=micro-dubbo
reactor.runtime.low-rss-gate.mode=enforce
reactor.dubbo.timeout-ms=1000
reactor.dubbo.retries=0
reactor.dubbo.max-inflight=64
reactor.dubbo.native-connections-per-endpoint=2
reactor.dubbo.native-max-idle-connections-per-endpoint=2
reactor.dubbo.native-idle-connection-ttl-ms=30000
reactor.dubbo.native-async-workers=2
reactor.dubbo.native-async-queue-capacity=64
reactor.dubbo.native-async-transport=blocking
reactor.dubbo.native-thread-stack-bytes=262144
